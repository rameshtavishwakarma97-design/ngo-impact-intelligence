kind = "web"
previewPath = "/"
title = "NGO Impact Intelligence"
description = "A high-fidelity frontend prototype for NGO program managers to run programs, monitor cohort health, investigate outcome patterns, trace evidence, and turn findings into accountable actions using realistic synthetic data."
version = "1.0.0"
id = "artifacts/ngo-impact-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19914

[services.development]
run = "pnpm --filter @workspace/ngo-impact-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ngo-impact-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/ngo-impact-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19914"
BASE_PATH = "/"
